name: Build iPhone and Android

# iPhone 版（ipa）と Android 版（apk）を毎回両方作り、1つのリリースにまとめる
# alpha ブランチ → 試験版（pre-release）、main ブランチ → 安定版
# 片方が作れなかったときは、作れたほうだけでリリースを出し、説明文にその旨を書く
on:
  workflow_dispatch:
  push:
    branches: [main, alpha]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "project.yml"
      - "android/**"
      - ".github/workflows/build-all.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.names.outputs.stamp }}
      channel: ${{ steps.names.outputs.channel }}
      prerelease: ${{ steps.names.outputs.prerelease }}
    steps:
      - name: Decide names
        id: names
        run: |
          echo "stamp=$(TZ=Asia/Tokyo date +%Y%m%d_%H%M)" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "channel=alpha" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  ios:
    needs: prepare
    # arm64 版が混雑しているため一時的に Intel 版を使う（Intel 版は2027年秋まで）
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project FridgeChef.xcodeproj \
            -scheme FridgeChef \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload dist
          cp -R build/Build/Products/Release-iphoneos/FridgeChef.app Payload/
          zip -qry "dist/FridgeChef_${{ needs.prepare.outputs.stamp }}.ipa" Payload

      - name: Keep IPA for the release
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: dist/*.ipa

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "署名の鍵（ANDROID_KEYSTORE_BASE64）が Secrets にありません。" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build (signed release)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FridgeChef_${{ needs.prepare.outputs.stamp }}.apk"

      - name: Keep APK for the release
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  release:
    needs: [prepare, ios, android]
    # どちらか片方でも作れていればリリースを出す
    if: ${{ always() && needs.prepare.result == 'success' && (needs.ios.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect files
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        env:
          MSG: ${{ github.event.head_commit.message }}
          IOS_RESULT: ${{ needs.ios.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          {
            if [ -n "$MSG" ]; then echo "$MSG"; else echo "手動でビルドしました"; fi
            if [ "$IOS_RESULT" != "success" ]; then
              echo
              echo "※ 今回 iPhone 版は作れませんでした（GitHub の Mac の混雑などのため）。iPhone は前のリリースの ipa を使ってください。"
            fi
            if [ "$ANDROID_RESULT" != "success" ]; then
              echo
              echo "※ 今回 Android 版は作れませんでした。Android は前のリリースの apk を使ってください。"
            fi
          } > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.channel }}-${{ needs.prepare.outputs.stamp }}
          name: FridgeChef ${{ needs.prepare.outputs.channel }} ${{ needs.prepare.outputs.stamp }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          body_path: notes.md
          files: dist/*
