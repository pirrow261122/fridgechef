name: Build unsigned IPA

# alpha ブランチ → 試験版（pre-release）、main ブランチ → 安定版
on:
  workflow_dispatch:
  push:
    branches: [main, alpha]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "project.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide names
        run: |
          STAMP="$(TZ=Asia/Tokyo date +%Y%m%d_%H%M)"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            CHANNEL="stable"
            PRERELEASE="false"
          else
            CHANNEL="alpha"
            PRERELEASE="true"
          fi
          {
            echo "STAMP=$STAMP"
            echo "CHANNEL=$CHANNEL"
            echo "PRERELEASE=$PRERELEASE"
            echo "IPA=FridgeChef_${STAMP}.ipa"
          } >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project FridgeChef.xcodeproj \
            -scheme FridgeChef \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FridgeChef.app Payload/
          zip -qry "$IPA" Payload

      - name: Upload as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: FridgeChef-ipa
          path: ${{ env.IPA }}

      - name: Publish release (direct download link for SideStore)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CHANNEL }}-${{ env.STAMP }}
          name: FridgeChef ${{ env.CHANNEL }} ${{ env.STAMP }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          files: ${{ env.IPA }}
          body: ${{ github.event.head_commit.message || '手動でビルドしました' }}
