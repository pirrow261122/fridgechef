name: Build Android APK

# alpha ブランチ → 試験版（pre-release）、main ブランチ → 安定版
on:
  workflow_dispatch:
  push:
    branches: [main, alpha]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide names
        run: |
          STAMP="$(TZ=Asia/Tokyo date +%Y%m%d_%H%M)"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            CHANNEL="stable"
            PRERELEASE="false"
          else
            CHANNEL="alpha"
            PRERELEASE="true"
          fi
          {
            echo "STAMP=$STAMP"
            echo "CHANNEL=$CHANNEL"
            echo "PRERELEASE=$PRERELEASE"
            echo "APK=FridgeChef_${STAMP}.apk"
          } >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "署名の鍵（ANDROID_KEYSTORE_BASE64）が Secrets にありません。" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build (signed release)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "$APK"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.CHANNEL }}-${{ env.STAMP }}
          name: FridgeChef Android ${{ env.CHANNEL }} ${{ env.STAMP }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          files: ${{ env.APK }}
          body: ${{ github.event.head_commit.message || '手動でビルドしました' }}
